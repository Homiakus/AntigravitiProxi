name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Validate Agent Tunnel config with real pinned sing-box
        env:
          AGP_LIVE_SINGBOX_SCHEMA: '1'
        run: go test ./internal/proxy -run TestAgentTunnelSchemaWithPinnedSingBox -count=1 -v

  linux-tun-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Download pinned sing-box 1.14.0
        shell: bash
        run: |
          set -euo pipefail
          VER=1.14.0
          ARCHIVE="sing-box-${VER}-linux-amd64.tar.gz"
          curl -fL --retry 4 --retry-all-errors \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/${ARCHIVE}" \
            -o "/tmp/${ARCHIVE}"
          rm -rf /tmp/agp-sing-box
          mkdir -p /tmp/agp-sing-box
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp/agp-sing-box
          BIN="$(find /tmp/agp-sing-box -type f -name sing-box -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          "$BIN" version
          echo "AGP_SINGBOX_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Build Linux runtime test binary
        run: go test -c ./internal/proxy -o /tmp/antigraviti-proxi-proxy.test
      - name: Real TUN start/health/cleanup in isolated netns
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe tun || true
          sudo modprobe nf_tables || true
          sudo modprobe nfnetlink_queue || true
          test -e /dev/net/tun

          sudo ip netns del agp-ci 2>/dev/null || true
          sudo ip netns add agp-ci
          cleanup() { sudo ip netns del agp-ci 2>/dev/null || true; }
          trap cleanup EXIT

          sudo ip netns exec agp-ci ip link set lo up
          sudo ip netns exec agp-ci ip link add vpn0 type dummy
          sudo ip netns exec agp-ci ip addr add 10.250.0.1/24 dev vpn0
          sudo ip netns exec agp-ci ip link set vpn0 up
          sudo ip netns exec agp-ci ip route add default dev vpn0

          sudo ip netns exec agp-ci env \
            AGP_LINUX_TUN_SMOKE=1 \
            AGP_SINGBOX_BIN="$AGP_SINGBOX_BIN" \
            AGP_TEST_VPN_INTERFACE=vpn0 \
            /tmp/antigraviti-proxi-proxy.test \
            -test.run '^TestLinuxAgentTunnelRuntimeSmoke$' -test.v

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w -X main.version=ci-${GITHUB_SHA::8}" -o "dist/antigraviti-proxi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/antigraviti-proxi
      - uses: actions/upload-artifact@v4
        with:
          name: antigraviti-proxi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
