name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Validate Agent Tunnel config with real pinned sing-box
        env:
          AGP_LIVE_SINGBOX_SCHEMA: '1'
        run: go test ./internal/proxy -run TestAgentTunnelSchemaWithPinnedSingBox -count=1 -v

  linux-tun-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Download pinned sing-box 1.14.0
        shell: bash
        run: |
          set -euo pipefail
          VER=1.14.0
          ARCHIVE="sing-box-${VER}-linux-amd64.tar.gz"
          curl -fL --retry 4 --retry-all-errors \
            "https://github.com/SagerNet/sing-box/releases/download/v${VER}/${ARCHIVE}" \
            -o "/tmp/${ARCHIVE}"
          rm -rf /tmp/agp-sing-box
          mkdir -p /tmp/agp-sing-box
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp/agp-sing-box
          BIN="$(find /tmp/agp-sing-box -type f -name sing-box -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          "$BIN" version
          echo "AGP_SINGBOX_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Build Linux runtime test binary
        run: go test -c ./internal/proxy -o /tmp/antigraviti-proxi-proxy.test
      - name: Real TUN + PID/path-aware dual-egress isolation in netns
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe tun || true
          sudo modprobe nf_tables || true
          sudo modprobe nfnetlink_queue || true
          test -e /dev/net/tun

          CLIENT_NS=agp-ci
          SINK_NS=agp-sink
          SERVER_PID=""

          cleanup() {
            if [[ -n "${SERVER_PID}" ]]; then
              sudo kill "${SERVER_PID}" 2>/dev/null || true
              wait "${SERVER_PID}" 2>/dev/null || true
            fi
            sudo ip netns del "${CLIENT_NS}" 2>/dev/null || true
            sudo ip netns del "${SINK_NS}" 2>/dev/null || true
            sudo rm -f /tmp/agp-source-server.py /tmp/agp-source-server.log
          }
          trap cleanup EXIT

          sudo ip netns del "${CLIENT_NS}" 2>/dev/null || true
          sudo ip netns del "${SINK_NS}" 2>/dev/null || true
          sudo ip netns add "${CLIENT_NS}"
          sudo ip netns add "${SINK_NS}"

          # Two physically distinct client egress interfaces terminate on the
          # same sink L2 segment. The system route prefers sys0; sing-box's
          # vpn-direct binds selected Antigravity traffic to vpn0.
          sudo ip link add agp-vpn type veth peer name agp-vpnp
          sudo ip link add agp-sys type veth peer name agp-sysp
          sudo ip link set agp-vpn netns "${CLIENT_NS}"
          sudo ip link set agp-sys netns "${CLIENT_NS}"
          sudo ip link set agp-vpnp netns "${SINK_NS}"
          sudo ip link set agp-sysp netns "${SINK_NS}"

          sudo ip netns exec "${CLIENT_NS}" ip link set lo up
          sudo ip netns exec "${CLIENT_NS}" ip link set agp-vpn name vpn0
          sudo ip netns exec "${CLIENT_NS}" ip link set agp-sys name sys0
          sudo ip netns exec "${CLIENT_NS}" ip addr add 198.18.0.2/32 dev vpn0
          sudo ip netns exec "${CLIENT_NS}" ip addr add 198.18.0.3/32 dev sys0
          sudo ip netns exec "${CLIENT_NS}" ip link set vpn0 up
          sudo ip netns exec "${CLIENT_NS}" ip link set sys0 up
          sudo ip netns exec "${CLIENT_NS}" ip route add 198.18.0.0/24 dev sys0 src 198.18.0.3 metric 10
          sudo ip netns exec "${CLIENT_NS}" ip route add 198.18.0.0/24 dev vpn0 src 198.18.0.2 metric 100
          sudo ip netns exec "${CLIENT_NS}" ip route add default dev sys0 metric 10
          sudo ip netns exec "${CLIENT_NS}" ip route add default dev vpn0 metric 100

          sudo ip netns exec "${SINK_NS}" ip link set lo up
          sudo ip netns exec "${SINK_NS}" ip link add br0 type bridge
          sudo ip netns exec "${SINK_NS}" ip link set agp-vpnp master br0
          sudo ip netns exec "${SINK_NS}" ip link set agp-sysp master br0
          sudo ip netns exec "${SINK_NS}" ip link set agp-vpnp up
          sudo ip netns exec "${SINK_NS}" ip link set agp-sysp up
          sudo ip netns exec "${SINK_NS}" ip addr add 198.18.0.1/24 dev br0
          sudo ip netns exec "${SINK_NS}" ip link set br0 up

          cat >/tmp/agp-source-server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = self.client_address[0].encode("ascii")
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, fmt, *args):
                  pass

          HTTPServer(("198.18.0.1", 18080), Handler).serve_forever()
          PY

          sudo ip netns exec "${SINK_NS}" python3 -u /tmp/agp-source-server.py \
            >/tmp/agp-source-server.log 2>&1 &
          SERVER_PID=$!

          for _ in $(seq 1 30); do
            if sudo ip netns exec "${SINK_NS}" curl --noproxy '*' -fsS \
              http://198.18.0.1:18080/ >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          sudo ip netns exec "${SINK_NS}" curl --noproxy '*' -fsS \
            http://198.18.0.1:18080/ >/dev/null

          echo '--- client routes before Agent Tunnel ---'
          sudo ip netns exec "${CLIENT_NS}" ip -4 route
          echo '--- sink links ---'
          sudo ip netns exec "${SINK_NS}" ip -4 addr

          sudo ip netns exec "${CLIENT_NS}" env \
            AGP_LINUX_TUN_SMOKE=1 \
            AGP_SINGBOX_BIN="$AGP_SINGBOX_BIN" \
            AGP_TEST_VPN_INTERFACE=vpn0 \
            AGP_EGRESS_PROBE_URL=http://198.18.0.1:18080/ \
            AGP_EXPECT_VPN_SOURCE=198.18.0.2 \
            AGP_EXPECT_SYSTEM_SOURCE=198.18.0.3 \
            /tmp/antigraviti-proxi-proxy.test \
            -test.run '^TestLinuxAgentTunnelRuntimeSmoke$' -test.v

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w -X main.version=ci-${GITHUB_SHA::8}" -o "dist/antigraviti-proxi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/antigraviti-proxi
      - uses: actions/upload-artifact@v4
        with:
          name: antigraviti-proxi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
