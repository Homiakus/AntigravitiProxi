name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Validate Agent Tunnel config with real sing-box
        shell: bash
        run: |
          set -euo pipefail
          VER=1.14.0
          ARCHIVE="sing-box-${VER}-linux-amd64.tar.gz"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${VER}/${ARCHIVE}"
          curl -fL --retry 4 --retry-all-errors "$URL" -o "/tmp/$ARCHIVE"
          mkdir -p /tmp/sing-box-ci
          tar -xzf "/tmp/$ARCHIVE" -C /tmp/sing-box-ci
          BIN="$(find /tmp/sing-box-ci -type f -name sing-box -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          "$BIN" version
          AGP_SINGBOX_BIN="$BIN" go test ./internal/proxy -run TestAgentTunnelConfigAcceptedByRealSingBox -v

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w -X main.version=ci-${GITHUB_SHA::8}" -o "dist/antigraviti-proxi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/antigraviti-proxi
      - uses: actions/upload-artifact@v4
        with:
          name: antigraviti-proxi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
